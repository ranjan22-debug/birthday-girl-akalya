<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday My Love</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #fff;
      text-align: center;
      overflow: hidden;
    }.container {
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
}

p {
  font-size: 1.2rem;
  max-width: 500px;
}

button {
  margin-top: 20px;
  padding: 12px 24px;
  border: none;
  border-radius: 25px;
  background: #fff;
  color: #ff6f91;
  font-size: 1rem;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #ffe6eb;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
}

@media (max-width: 600px) {
  h1 {
    font-size: 2rem;
  }

  p {
    font-size: 1rem;
  }
}

  </style>
</head>
<body>
  <canvas id="confetti"></canvas>  <div class="container">
    <h1>Happy Birthday ❤️</h1>
    <p>
      My love, you are the most beautiful part of my life. 
      Every moment with you feels magical. 
      I wish you endless happiness, love, and smiles today and forever.
    </p>
    <button onclick="startConfetti()">Celebrate 🎉</button>
  </div>  <script>
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');

    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createParticles() {
      for (let i = 0; i < 150; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          r: Math.random() * 6 + 2,
          d: Math.random() * 50,
          color: `hsl(${Math.random() * 360}, 100%, 70%)`,
          tilt: Math.floor(Math.random() * 10) - 10
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.r, p.r);
      });
      updateParticles();
    }

    function updateParticles() {
      particles.forEach((p, i) => {
        p.y += Math.cos(p.d) + 1 + p.r / 2;
        p.x += Math.sin(p.d);

        if (p.y > canvas.height) {
          particles[i] = {
            x: Math.random() * canvas.width,
            y: -10,
            r: p.r,
            d: p.d,
            color: p.color,
            tilt: p.tilt
          };
        }
      });
    }

    function animate() {
      drawParticles();
      requestAnimationFrame(animate);
    }

    function startConfetti() {
      particles = [];
      createParticles();
      animate();
    }
  </script></body>
</html>
